<script type="text/JavaScript">
/* ---------- base.js ---------- */
function onload_scroll() {
    var TWL_SHOP_SE_TRANSIT = 37;
    
	gkong.ShowUpWindowScrollButton();
	gkong.PlaySE(TWL_SHOP_SE_TRANSIT);
}

/* ---------- inline script ---------- */
window.addEventListener('DOMContentLoaded', initPage, false );

var indexChanger;

function initPage()
{
 	indexChanger    = new kugi.SceneChanger( $("indexButtonBases").children, $("indexButtonContents").children );
    
    btnPrev.onmouseup   = "changeIndexButtons(-1)";
    btnNext.onmouseup   = "changeIndexButtons(+1)";
    btnBack.onmouseup   = "showBackInManual()";
    
    showPageNumber();
    showPageTitle();
    
    if ( gkong )
        onload_scroll();
}

function changeIndexButtons( relative )
{
    var _setupIndexButtons = function()
    {
        indexChanger.move( relative );
        showPageNumber();
        showPageTitle();
        kugi.Button.reset();
	gkong.PlaySE(TWL_SHOP_SE_TRANSIT);
    }
    
    if ( gkong )
    {
        var gTRangeUpY0 =   0;
        var gTRangeUpY1 = 192;  /* #### 20080711 #### Changed from 191 to 192. */
        var gTRangeDnY0 =   0;
        var gTRangeDnY1 = 164;
        gkong.SetTransitionRangeOnce( gTRangeUpY0, gTRangeUpY1, gTRangeDnY0, gTRangeDnY1 );
    }
    
    var anim_d = ( relative > 0 ) ? WIPE_ANIM_OVER_RIGHT : WIPE_ANIM_OVER_LEFT;
    kugi.Transit.changeScene( _setupIndexButtons, anim_d, WIPE_ANIM_NONE );
}

function showPageNumber()
{
    pageNumber.innerHTML = (indexChanger.getCurrentPage() + 1 ) + " / " + indexChanger.getPageNum();
}

function showPageTitle()
{
    // <!-- Down Window Title -->
    // <!-- TODO : Please change this part. -->
    var title = "Contents";
    $("msgTitle").innerHTML = title + " " + (indexChanger.getCurrentPage() + 1);
}

function showUpContent( url )
{
    kugi.Transit.movePage( "", url, WIPE_ANIM_NONE, WIPE_ANIM_UP );
}

function showBackInManual()
{
    var up_url = ec.getSessionValue("history.manual.urlU");
    var dw_url = ec.getSessionValue("history.manual.urlD");
    
    showPage( dw_url, up_url );
}
</script>
